name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Pytest
        env:
          DEFAULT_ORIGIN_IATA: DAC
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_mock_test_key_for_ci_pipeline' }}
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY || 'mock_aviationstack_key' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly_mock_key' }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY || 'mock_openweather_key' }}
        run: |
          pytest -v tests/
