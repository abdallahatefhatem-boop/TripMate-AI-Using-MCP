[project]
name = "tripmate-ai"
version = "0.1.0"
description = "TripMate AI - Multi-Agent Travel Planner using LangGraph, Groq, Tavily, and AviationStack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.1.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "logs",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]
ignore = [
    "E402", # module level import not at top of file
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (e.g. Depends)
    "B904", # raise ... from err
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "backend*",
    "configuration*",
    "constant*",
    "entity*",
    "exception*",
    "logger*",
    "tools*",
]
exclude = [
    "tests*",
    "static*",
    "templates*",
    "logs*",
]

